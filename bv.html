<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Botinavision · Botina</title>
<meta name="description" content="Botinavision: instrumento visual 3D en tiempo real que reacciona al sonido. Gratis para artistas.">
<style>
@font-face{font-family:Geist;src:url(assets/geist.woff) format("woff");font-weight:100 900;font-display:swap}
@font-face{font-family:"Geist Mono";src:url(assets/geist-mono.woff) format("woff");font-weight:100 900;font-display:swap}
:root{--c:#19d4ff;--w:#e8f4f8;--d:rgba(232,244,248,.6)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#05070b;color:var(--w);font-family:Geist,system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:48px 24px;
 background:radial-gradient(120% 80% at 50% 110%,rgba(25,212,255,.16),transparent 60%),repeating-linear-gradient(0deg,rgba(25,212,255,.05) 0 1px,transparent 1px 34px),repeating-linear-gradient(90deg,rgba(25,212,255,.05) 0 1px,transparent 1px 34px),#05070b}
main{max-width:620px}
.k{font-family:"Geist Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--c);margin:0 0 18px}
h1{font-size:clamp(40px,8vw,68px);line-height:1;margin:0 0 22px;font-weight:600;letter-spacing:-.02em}
p{font-size:18px;line-height:1.55;color:var(--d);margin:0 0 16px}
p b{color:var(--w);font-weight:500}
.free{display:inline-block;font-family:"Geist Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--c);color:var(--c);padding:5px 10px;margin:6px 0 26px}
.go{display:inline-block;font-family:"Geist Mono",ui-monospace,monospace;font-size:14px;letter-spacing:.1em;text-transform:uppercase;background:var(--c);color:#031018;text-decoration:none;padding:15px 22px;font-weight:600}
.go:hover{filter:brightness(1.1)}
.n{font-size:14px;color:var(--d);margin-top:22px}
.back{display:inline-block;margin-top:30px;color:var(--d);font-size:14px;text-decoration:none;border-bottom:1px solid rgba(232,244,248,.25)}
#lang{position:fixed;top:20px;right:20px;background:none;border:1px solid rgba(232,244,248,.3);color:var(--w);font:12px "Geist Mono",monospace;padding:7px 10px;cursor:pointer}
</style></head><body>
<button id="lang">EN</button>
<main>
<p class="k" data-k="k"></p>
<h1><img src="assets/logo.webp" alt="Botinavision" width="1200" height="128" style="display:block;width:min(100%,560px);height:auto"></h1>
<p data-k="p1"></p>
<p data-k="p2"></p>
<span class="free" data-k="free"></span><br>
<a class="go" href="https://botinagh.github.io/botinavision/" data-k="go"></a>
<p class="n" data-k="n"></p>
<a class="back" href="./" data-k="back"></a>
</main>
<script>
const T={es:{k:"Instrumento visual · por Botina",p1:"Convierte cualquier sonido en un <b>espectrograma 3D en tiempo real</b> que se toca en vivo: color, cámara, luces y glitch, con el mouse, el teclado o un controlador MIDI.",p2:"Es la herramienta con la que creo mis visuales y la que da vida a mi portafolio.",free:"Gratis para artistas",go:"Abrir Botinavision ↗",n:"Funciona en el navegador, sin instalar nada. Mejor en Chrome o Edge, en computador. Usa un archivo de audio o el micrófono.",back:"← Volver al portafolio"},
en:{k:"Visual instrument · by Botina",p1:"Turns any sound into a <b>real-time 3D spectrogram</b> you play live: color, camera, lights and glitch, with mouse, keyboard or a MIDI controller.",p2:"It's the tool I make my visuals with, and the one that brings my portfolio to life.",free:"Free for artists",go:"Open Botinavision ↗",n:"Runs in the browser, nothing to install. Best in Chrome or Edge on a computer. Use an audio file or your microphone.",back:"← Back to the portfolio"}};
let lang=(new URLSearchParams(location.search).get("lang"))||((navigator.language||"en").toLowerCase().startsWith("es")?"es":"en");if(!T[lang])lang="en";
function apply(){document.documentElement.lang=lang;document.querySelectorAll("[data-k]").forEach(e=>e.innerHTML=T[lang][e.dataset.k]);document.getElementById("lang").textContent=lang==="es"?"EN":"ES"}
document.getElementById("lang").onclick=()=>{lang=lang==="es"?"en":"es";apply()};apply();
</script>
</body></html>
