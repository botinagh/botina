<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba MIDI</title>
<style>body{background:#06040c;color:#e8f0f4;font:16px/1.5 system-ui,sans-serif;max-width:640px;margin:60px auto;padding:0 20px}button{font:inherit;padding:12px 20px;background:#0b1a22;color:#5fe0ff;border:1px solid #5fe0ff;cursor:pointer}#o{margin-top:24px;white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:14px}</style></head><body>
<h2>Prueba MIDI</h2><p>Esta página no hace nada más que pedir acceso MIDI y medir cuánto tarda el navegador en responder. Pulsa el botón y espera.</p>
<button id="b">Pedir acceso MIDI</button><div id="o"></div>
<script>const o=document.getElementById('o');let t0;const tick=setInterval(()=>{if(t0)o.dataset.w=Math.round((performance.now()-t0)/1000)},500);
document.getElementById('b').onclick=()=>{if(!navigator.requestMIDIAccess){o.textContent='Este navegador no tiene Web MIDI.';return}t0=performance.now();o.textContent='Esperando respuesta del navegador…';
navigator.requestMIDIAccess().then(a=>{const s=((performance.now()-t0)/1000).toFixed(1);o.textContent='Respuesta en '+s+' s\nEntradas: '+([...a.inputs.values()].map(i=>i.name).join(', ')||'ninguna')+'\nSalidas: '+([...a.outputs.values()].map(i=>i.name).join(', ')||'ninguna')}).catch(e=>{o.textContent='Rechazado tras '+((performance.now()-t0)/1000).toFixed(1)+' s: '+(e&&e.name)})}</script></body></html>
