   if(p.l){infoA.hidden=false;infoA.href=p.l;infoA.textContent=p.lt+" ↗"}else infoA.hidden=true}
  info.style.opacity=iop;info.style.pointerEvents=iop>.5?"auto":"none";
 }else{info.style.opacity=0;info.style.pointerEvents="none";lastInfo=-1}
 pops.forEach((e,k)=>e.classList.toggle("on",r6>.5&&(posS-(NST-1))+.9>k*.2+.25));
 moreEl.classList.toggle("on",r6>.5&&(posS-(NST-1))+.9>1.45);
 dotEls.forEach((e,k)=>e.classList.toggle("on",k===nearest));
 lpfShown+=(fcDom-lpfShown)*.2;
 $("#lpft").textContent="LPF "+(lpfShown>=1000?(lpfShown/1000).toFixed(1)+" kHz":Math.round(lpfShown)+" Hz");
 $("#lpfb").style.width=(100*Math.log(lpfShown/CUT_LO)/Math.log(CUT_HI/CUT_LO)).toFixed(1)+"%";
  if(DEBUG)dbg.textContent=(window.__gpuName||"")+" | fps "+(1/dtE).toFixed(0)+(lite?" LITE":"")+" q "+qs.toFixed(2)+" R "+R.toFixed(2)+" audio "+audioOn+" clk "+ck.toFixed(1)+" "+(ctx?ctx.state:"-")+(GLOST?" GL-LOST":"")+"\nvideo "+vi+" rs"+vEls[vi].readyState+(vEls[vi].paused?" P":" >")+" t"+vEls[vi].currentTime.toFixed(1)+" vA "+VA.toFixed(2)+" | ready "+vEls.map(v=>v.readyState).join("")+" scan "+scanv.readyState+(window.__err?"\nERR "+window.__err.slice(0,160):"");
}

/* ---------- boot ---------- */
let entered=false;
async function enter(sound){if(entered)return;entered=true;
 gateOpen=true;$("#gate").style.setProperty("--gb","0px");$("#gate").classList.add("off");document.documentElement.classList.remove("lock");$("#ver").style.opacity=.0;
 try{await startAudio(sound);$("#snd").classList.toggle("on",!muted)}catch(e){console.warn("audio",e)}
}
let gateOpen=false,gateT=0,gp=0,gDn=0;
function gateTick(){if(gateOpen)return;gateT+=.1;
 let L=0,T=GATE_V.length,dn=0;for(const v of GATE_V){const p=vProg(v);L+=p;if(p>=1)dn++}
 const tgt=T?L/T:0;gp+=(tgt-gp)*.35;if(dn===GATE_V.length&&Math.abs(tgt-gp)<.02)gp=1;
 const f=CUT_LO*Math.pow(CUT_HI/CUT_LO,gp);
 $("#gpf").textContent="LPF "+(f<1000?Math.round(f)+" HZ":(f/1000).toFixed(1)+" KHZ");
 $("#gbar").style.width=(gp*100).toFixed(1)+"%";
 const gt=$("#gate");gt.style.setProperty("--gb",(16*(1-gp)).toFixed(1)+"px");
 if(dn!==gDn){gDn=dn;const im=$("#gate img");im.classList.remove("gli");void im.offsetWidth;im.classList.add("gli")}
 const ready=(dn===GATE_V.length&&abDone>=N)||gateT>30;
 if(ready&&!gt.classList.contains("rdy")){gt.classList.add("rdy");$("#gpf").textContent=dn===GATE_V.length?"LPF 18.0 KHZ":$("#gpf").textContent;$("#gbar").style.width="100%";gt.style.setProperty("--gb","0px")}
 if(!ready)setTimeout(gateTick,100)}
gateTick();
$("#go").onclick=()=>enter(true);$("#goq").onclick=()=>enter(false);
$("#snd").onclick=()=>{if(!ctx||!muteG)return;muted=!muted;muteG.gain.setTargetAtTime(muted?0:1,ctx.currentTime,.03);$("#snd").classList.toggle("on",!muted);if(!muted&&silentEl)silentEl.play().catch(()=>{})};
$("#lang").onclick=()=>{lang=lang==="en"?"es":"en";applyLang()};
$("#brand").onclick=e=>{e.preventDefault();scrollTo({top:0,behavior:"smooth"})};
addEventListener("pagehide",()=>{try{if(ctx&&ctx.state!=="closed")ctx.close()}catch(e){}});
["pointerdown","touchend","keydown","wheel"].forEach(ev=>addEventListener(ev,()=>{if(ctx&&ctx.state!=="running"&&!document.hidden)ctx.resume().catch(()=>{})},{passive:true}));
const SLEEP=false;
document.addEventListener("visibilitychange",()=>{if(!document.hidden)[0,300,900,2000].forEach(d=>setTimeout(()=>{try{if(ctx&&ctx.state!=="running"&&ctx.state!=="closed")ctx.resume()}catch(e){}},d));try{if(document.hidden){(typeof vEls!=="undefined"?vEls:[]).forEach(v=>v&&v.pause&&v.pause());const sv=document.getElementById("scanv");sv&&sv.pause()}}catch(e){}});
let RELEASED=false;const BVSRC=bv.getAttribute("src");
function restoreBV(){if(!RELEASED||document.hidden)return;RELEASED=false;bv._cap=-1;bv.src=BVSRC}
document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest('a[href*="botinavision"]');if(!a)return;e.preventDefault();e.stopPropagation();if(RELEASED)return;RELEASED=true;
 try{vEls.forEach(v=>v.pause());scanv.pause()}catch(x){}try{bv.src="about:blank"}catch(x){}
 const url=a.href;setTimeout(()=>{window.open(url,"_blank","noopener");setTimeout(()=>{if(!document.hidden)restoreBV()},2500)},350)},true);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)setTimeout(restoreBV,300)});
let lastOpen=0;document.getElementById("more").addEventListener("click",e=>{const a=e.target.closest("a");if(!a)return;const t=Date.now();if(t-lastOpen<2500){e.preventDefault();return}lastOpen=t});
addEventListener("resize",resize);
document.documentElement.classList.add("lock");
applyLang();resize();requestAnimationFrame(frame)
if("scrollRestoration" in history)history.scrollRestoration="manual";
})();
