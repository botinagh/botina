 window.__dbg={q:qs,R,dom,cut:fcDom,audioOn,r:Array.from(r),vs:[pv._i,pv.readyState,pv.paused,pv.videoWidth,+pv.currentTime.toFixed(1)]};
 if(DEBUG)dbg.textContent="fps "+(1/dtE).toFixed(0)+(lite?" LITE":"")+" q "+qs.toFixed(2)+" R "+R.toFixed(2)+" audio "+audioOn+" clk "+ck.toFixed(1)+" "+(ctx?ctx.state:"-")+(GLOST?" GL-LOST":"")+"\nplayer piece "+pv._i+(pv._ok?" ok":" wait")+" try"+pv._tries+" rs"+pv.readyState+(pv.paused?" P":" >")+" "+pv.videoWidth+"x"+pv.videoHeight+" t"+pv.currentTime.toFixed(1)+" vA "+(window.__vA||0).toFixed(2)+"\nblobs "+vids.map((q,i)=>P[i].id.slice(0,4)+(q._url?"✓":q._src?"…":"–")).join(" ")+" scan "+(scanv._url?"✓":"–")+(window.__err?"\nERR "+window.__err.slice(0,160):"");
}

/* ---------- boot ---------- */
let entered=false;
async function enter(sound){if(entered)return;entered=true;
 gateOpen=true;$("#gate").style.setProperty("--gb","0px");$("#gate").classList.add("off");document.documentElement.classList.remove("lock");$("#ver").style.opacity=.0;
 try{await startAudio(sound);$("#snd").classList.toggle("on",!muted)}catch(e){console.warn("audio",e)}
}
let gateOpen=false,gateT=0,gp=0,gDn=0;
function gateTick(){if(gateOpen)return;gateT+=.1;
 let L=0,T=0,dn=0;for(const k of GATE_KEYS){const p=PG[k];const t=SZ[k];T+=t;if(p&&p.d){L+=t;dn++}else if(p&&p.t){L+=Math.min(.97,p.l/p.t)*t}}
 const tgt=T?L/T:0;gp+=(tgt-gp)*.35;if(dn===GATE_KEYS.length&&Math.abs(tgt-gp)<.02)gp=1;
 const f=CUT_LO*Math.pow(CUT_HI/CUT_LO,gp);
 $("#gpf").textContent="LPF "+(f<1000?Math.round(f)+" HZ":(f/1000).toFixed(1)+" KHZ");
 $("#gbar").style.width=(gp*100).toFixed(1)+"%";
 const gt=$("#gate");gt.style.setProperty("--gb",(16*(1-gp)).toFixed(1)+"px");
 if(dn!==gDn){gDn=dn;const im=$("#gate img");im.classList.remove("gli");void im.offsetWidth;im.classList.add("gli")}
 const ready=dn===GATE_KEYS.length||gateT>20;
 if(ready&&!gt.classList.contains("rdy")){gt.classList.add("rdy");$("#gpf").textContent=dn===GATE_KEYS.length?"LPF 18.0 KHZ":$("#gpf").textContent;$("#gbar").style.width="100%";gt.style.setProperty("--gb","0px")}
 if(!ready)setTimeout(gateTick,100)}
gateTick();
$("#go").onclick=()=>enter(true);$("#goq").onclick=()=>enter(false);
$("#snd").onclick=()=>{if(!ctx||!muteG)return;muted=!muted;muteG.gain.setTargetAtTime(muted?0:1,ctx.currentTime,.03);$("#snd").classList.toggle("on",!muted);if(!muted&&silentEl)silentEl.play().catch(()=>{})};
$("#lang").onclick=()=>{lang=lang==="en"?"es":"en";applyLang()};
$("#brand").onclick=e=>{e.preventDefault();scrollTo({top:0,behavior:"smooth"})};
const cleanup=()=>{try{pim.removeAttribute("src");pv.pause();pv.removeAttribute("src");pv.load();scanv.pause();scanv.removeAttribute("src");scanv.load();bv.src="about:blank";if(ctx&&ctx.state!=="closed")ctx.close()}catch(e){}};addEventListener("pagehide",cleanup);addEventListener("beforeunload",cleanup);
["pointerdown","touchend","keydown","wheel"].forEach(ev=>addEventListener(ev,()=>{if(ctx&&ctx.state!=="running"&&!document.hidden)ctx.resume().catch(()=>{})},{passive:true}));
document.addEventListener("visibilitychange",()=>{if(!ctx)return;document.hidden?ctx.suspend():ctx.resume()});
addEventListener("resize",resize);
document.documentElement.classList.add("lock");
applyLang();resize();requestAnimationFrame(frame)
if("scrollRestoration" in history)history.scrollRestoration="manual";
})();
</script>
